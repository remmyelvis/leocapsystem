name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

# never run two deploys of the same app at once (they share one FTP sync-state file)
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_BACKEND_URL: https://api.leocapinvest.co.ke
        run: npm ci && npm run build

      # leocapinvest.co.ke -> /home/leocapin/public_html
      - name: Upload dist to leocapinvest.co.ke (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: cs1.hpcnoc.com
          protocol: ftps
          port: 21
          username: ${{ secrets.FTP_WEB_USERNAME }}
          password: ${{ secrets.FTP_WEB_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /

      # app.leocapinvest.co.ke -> /home/leocapin/app.leocapinvest.co.ke
      - name: Upload dist to app.leocapinvest.co.ke
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: cs1.hpcnoc.com
          protocol: ftps
          port: 21
          username: ${{ secrets.FTP_APP_USERNAME }}
          password: ${{ secrets.FTP_APP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /
