name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Passenger restarts the app when tmp/restart.txt changes
      - name: Create restart marker
        run: mkdir -p backend/tmp && date -u > backend/tmp/restart.txt

      - name: Upload backend over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: cs1.hpcnoc.com
          protocol: ftps
          port: 21
          username: ${{ secrets.FTP_API_USERNAME }}
          password: ${{ secrets.FTP_API_PASSWORD }}
          local-dir: ./backend/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/*.pyc
            .htaccess
            .env
            website/.env
            instance/**
            app.log
            **/*.db
            demo_seeder.py
            README.md
            runcommands.txt
            jsons.txt
            run_backend_local.ps1
            website/applicant_documents/**
            website/application_documents/**
            website/confirmation_documents/**
